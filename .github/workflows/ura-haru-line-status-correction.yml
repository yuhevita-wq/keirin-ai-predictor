name: Ura Haru - Correct Unknown Line Status
on:
  push:
    branches: [ura-haruq/independent-train-20261024]
    paths: [.github/workflows/ura-haru-line-status-correction.yml]
permissions:
  contents: write
jobs:
  correct-ura-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check frozen file and run boundary tests
        run: |
          echo "b0891724787f3c300a2b58d0d19cc6cf4ff421225ea53c81b94ab3add7194818  ura_haruq_independent/frozen_ura_haru_v1/URA_HARU_V1_FROZEN_RULE.py" | sha256sum -c -
          python -m unittest ura_haruq_independent.recommendation.test_low_quarter_advisory -v
      - name: Relabel only missing line source without changing any forecast/bet
        run: python -m ura_haruq_independent.web.relabel_unpublished_lines
      - name: Commit only independent Ura result files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ura-haru/results/index.json
          find docs/ura-haru/results -maxdepth 1 -type f -name '[0-9]*.json' -print0 | xargs -0 -r git add -f
          test -z "$(git diff --cached --name-only | grep -v '^docs/ura-haru/results/' || true)"
          if ! git diff --cached --quiet; then
            git commit -m "Label Ura line-unpublished races honestly [skip ci]"
            git push origin HEAD:ura-haruq/independent-train-20261024
          fi
