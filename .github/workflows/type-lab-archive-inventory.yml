name: Full Keirin archive inventory (all paths)

on:
  push:
    branches:
      - research/type-lab-v0-20261022
    paths:
      - "research/type_lab_v0/inventory.py"
      - ".github/workflows/type-lab-archive-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-file-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout audit scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect all tracked paths without downloading archive payloads
        shell: bash
        run: |
          git -c http.version=HTTP/1.1 clone --filter=blob:none --no-checkout --depth=1 \
            https://github.com/yuhevita-wq/keirin-market-analysis-.git source-repo
          python research/type_lab_v0/inventory.py source-repo archive-inventory
      - name: Save all path and source-blob SHA metadata
        uses: actions/upload-artifact@v4
        with:
          name: all-keirin-source-paths
          path: archive-inventory/
          retention-days: 30
