name: Diagnose netkeirin Historical Race Discovery
on:
  push:
    paths:
      - ".github/workflows/diagnose-netkeirin-discovery.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic libraries
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe three known dates and save response metadata (no HTML)
        run: python scripts/diagnose_netkeirin_discovery.py
      - name: Commit diagnostic metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/netkeirin_discovery_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "Record real netkeirin historical discovery HTTP evidence"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
