name: Ura HaruQ V6 - Archived Pre-race Line Structures

# Only explicit change to this workflow on isolated Ura research branch triggers.
on:
  push:
    branches:
      - ura-haruq/independent-train-20261024
    paths:
      - .github/workflows/ura-v6-prerace-line-export.yml

permissions:
  contents: read

concurrency:
  group: ura-v6-prerace-line-export
  cancel-in-progress: false

jobs:
  export-structures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify script and inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ura_haruq_independent/export_prerace_line_structure.py
          test ! -e db/keirin.db
          test "${#COLLECTOR_PASSPHRASE}" -ge 32
      - name: Download historical encrypted archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ura-v6-hist"
          gh release download haruqube-20260321-history-cache-v1 --repo "$GITHUB_REPOSITORY" \
             --pattern keirin-history.sqlite.gpg \
             --pattern ENCRYPTED_SHA256SUMS.txt \
             --pattern PLAINTEXT_SHA256.txt \
             --dir "$RUNNER_TEMP/ura-v6-hist"
          (cd "$RUNNER_TEMP/ura-v6-hist"; sha256sum -c ENCRYPTED_SHA256SUMS.txt)
      - name: Decrypt verified archived history in ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p db
          printf %s "$COLLECTOR_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --output db/keirin.db --decrypt \
            "$RUNNER_TEMP/ura-v6-hist/keirin-history.sqlite.gpg"
          (cd db; sha256sum -c "$RUNNER_TEMP/ura-v6-hist/PLAINTEXT_SHA256.txt")
          chmod 600 db/keirin.db
      - name: Extract ONLY pre-race line structure
        run: python -u ura_haruq_independent/export_prerace_line_structure.py
      - name: Upload pre-race structure features, never original DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ura-v6-prerace-line-structures
          path: ura_haruq_independent/diagnostics/line_structure_2024_2026/
          retention-days: 90
          if-no-files-found: warn
      - name: Remove decrypted archive
        if: always()
        run: rm -f db/keirin.db
