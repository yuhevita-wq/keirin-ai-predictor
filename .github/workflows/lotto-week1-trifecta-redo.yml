name: Week 1 Trifecta Formation Redo
on:
  push:
    branches: [research/formation-cover-20230101]
    paths: [.github/workflows/lotto-week1-trifecta-redo.yml]
permissions:
  contents: write
concurrency:
  group: lotto-week1-trifecta-redo
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: collected-data-2023-01
          path: source
      - name: Validate syntax
        run: python -m py_compile scripts/lotto_week1_trifecta_redo.py
      - name: Enumerate pre-race formations then investigate payouts
        env:
          COLLECTION_KEY: ${{ secrets.COLLECTOR_PASSPHRASE }}
        run: python -u scripts/lotto_week1_trifecta_redo.py
      - name: Save research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week1-trifecta-formation-redo
          path: research/formation_cover/week1_trifecta_redo/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit derived research outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/formation_cover/week1_trifecta_redo/
          if ! git diff --cached --quiet; then
            git commit -m "Save first-week trifecta formation payouts and matched comparison candidates"
            git push origin HEAD:research/formation-cover-20230101
          fi
