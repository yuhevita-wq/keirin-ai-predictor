name: Build Encrypted Flagship Race History Cache

on:
  push:
    branches:
      - production/flagship-haruqube-20260321-live-v1
    paths:
      - .github/workflows/build-flagship-history-cache.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-flagship-history-20261023
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify passphrase and fetch every newly-collected completed day
        shell: bash
        run: |
          set -euo pipefail
          test "${#COLLECTOR_PASSPHRASE}" -ge 32
          test ! -f db/keirin.db
          git fetch --no-tags --depth=1 origin '+refs/heads/collected-data-*:refs/remotes/origin/collected-data-*'
          test "$(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/collected-data-*' | wc -l)" -ge 24
      - name: Install source-compatible dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            lightgbm==4.6.0 pandas==2.3.3 numpy==2.2.6 \
            scikit-learn==1.7.2 python-dotenv==1.1.1 \
            requests beautifulsoup4 lxml
      - name: Build encrypted history without modifying the frozen model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          import scripts.reproduce_haruqube_fresh as src
          src.OUT=Path("history_archive")
          src.OUT.mkdir(parents=True,exist_ok=True)
          report=src.prepare_db()
          assert report["races_imported"]>=98000
          conn=sqlite3.connect("db/keirin.db")
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          assert conn.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          conn.close()
          print("FLAGSHIP_HISTORY_MERGED",report["races_imported"],report["days_complete"])
          PY
          test -s db/keirin.db
          ( cd db && sha256sum keirin.db > ../history_archive/PLAINTEXT_SHA256.txt )
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --cipher-algo AES256 --symmetric --output history_archive/keirin-history.sqlite.gpg \
              db/keirin.db <<< "${COLLECTOR_PASSPHRASE}"
          rm db/keirin.db
          test -s history_archive/keirin-history.sqlite.gpg
          ( cd history_archive && sha256sum keirin-history.sqlite.gpg > ENCRYPTED_SHA256SUMS.txt )
      - name: Store reproducible encrypted cache independently of expiring Actions artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="haruqube-20260321-history-cache-v1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing immutable cache found, verifying required assets"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx keirin-history.sqlite.gpg
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx collection_manifest.json
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Encrypted fixed-history snapshot (not a model)" \
            --notes "Historical newly collected 2023+ races. AES256 encrypted, no plaintext published. Independent from frozen 2026-03-21 model." \
            --prerelease --latest=false \
            history_archive/keirin-history.sqlite.gpg \
            history_archive/collection_manifest.json \
            history_archive/PLAINTEXT_SHA256.txt \
            history_archive/ENCRYPTED_SHA256SUMS.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx keirin-history.sqlite.gpg
          echo "FLAGSHIP_HISTORY_CACHE_READY"
      - name: Delete local decrypted DB even on failure
        if: always()
        run: rm -f db/keirin.db
