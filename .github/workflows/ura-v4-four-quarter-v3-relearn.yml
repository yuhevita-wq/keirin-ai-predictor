name: Ura HaruQ V4 - V3-type Relearn for Four LOW Quarters

# Research-only. Run when this new workflow is explicitly added/updated on
# the independent Ura branch. Code changes alone do not start training.
on:
  push:
    branches:
      - ura-haruq/independent-train-20261024
    paths:
      - .github/workflows/ura-v4-four-quarter-v3-relearn.yml

permissions:
  contents: read

concurrency:
  group: ura-v4-four-quarter-v3-relearn
  cancel-in-progress: false

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout independent Ura branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen source and diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e db/keirin.db
          test -s ura_haruq_independent/train_v4_low_quarter_v3_types.py
          python -m py_compile ura_haruq_independent/train_v4_low_quarter_v3_types.py
          git hash-object research_snapshots/haruqube_20260321/config.py | grep -Fx 011c2091816d16358dfe478726bcb0ff2bc74bf9
          git hash-object research_snapshots/haruqube_20260321/features/builder.py | grep -Fx b47b793b5cf763bcb6d05137a115105006e50eba
          git hash-object research_snapshots/haruqube_20260321/features/line_features.py | grep -Fx ecf3ab7c762475946054f806bb1d4b802c889389

      - name: Download immutable frozen predictor and encrypted historical data
        shell: bash
        run: |
          set -euo pipefail
          test "${#COLLECTOR_PASSPHRASE}" -ge 32
          mkdir -p "$RUNNER_TEMP/ura-v4-input/model" "$RUNNER_TEMP/ura-v4-input/history"
          gh release download haruqube-20260321-flagship-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern haruqube_20260321_fresh_model.pkl \
            --dir "$RUNNER_TEMP/ura-v4-input/model"
          gh release download haruqube-20260321-history-cache-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern keirin-history.sqlite.gpg \
            --pattern ENCRYPTED_SHA256SUMS.txt \
            --pattern PLAINTEXT_SHA256.txt \
            --dir "$RUNNER_TEMP/ura-v4-input/history"
          printf '%s  %s\n' \
            e70690f4538b77e927a042e7ae2db312f8a0a4f16bf72def37e7ccad3568c193 \
            "$RUNNER_TEMP/ura-v4-input/model/haruqube_20260321_fresh_model.pkl" \
            | sha256sum -c -
          (
            cd "$RUNNER_TEMP/ura-v4-input/history"
            sha256sum -c ENCRYPTED_SHA256SUMS.txt
          )

      - name: Restore frozen source in temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          cp research_snapshots/haruqube_20260321/config.py config.py
          cp research_snapshots/haruqube_20260321/features/builder.py features/builder.py
          cp research_snapshots/haruqube_20260321/features/line_features.py features/line_features.py

      - name: Install original predictor dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            lightgbm==4.6.0 pandas==2.3.3 numpy==2.2.6 \
            scikit-learn==1.7.2 python-dotenv==1.1.1 \
            requests beautifulsoup4 lxml

      - name: Self-test all 21952 V3 cuboid candidates
        shell: bash
        run: |
          set -euo pipefail
          python -u ura_haruq_independent/train_v4_low_quarter_v3_types.py --self-test

      - name: Decrypt archived race data only in Actions runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p db
          printf %s "$COLLECTOR_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --output db/keirin.db --decrypt \
            "$RUNNER_TEMP/ura-v4-input/history/keirin-history.sqlite.gpg"
          (
            cd db
            sha256sum -c "$RUNNER_TEMP/ura-v4-input/history/PLAINTEXT_SHA256.txt"
          )
          chmod 600 db/keirin.db

      - name: Learn independently in four LOW quarters and test 2025
        shell: bash
        run: |
          set -euo pipefail
          python -u ura_haruq_independent/train_v4_low_quarter_v3_types.py \
            --model "$RUNNER_TEMP/ura-v4-input/model/haruqube_20260321_fresh_model.pkl"
          test -s ura_haruq_independent/diagnostics/v4_four_quarter_v3_relearn/v4_four_quarter_relearn.json
          test -s ura_haruq_independent/diagnostics/v4_four_quarter_v3_relearn/race_level_outcomes.csv.gz

      - name: Upload research outputs only (no model or decrypted history)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ura-v4-four-quarter-v3-relearn
          path: ura_haruq_independent/diagnostics/v4_four_quarter_v3_relearn/
          retention-days: 90
          if-no-files-found: warn

      - name: Remove decrypted historical DB
        if: always()
        shell: bash
        run: |
          if test -e db/keirin.db; then
            rm -f db/keirin.db
          fi
