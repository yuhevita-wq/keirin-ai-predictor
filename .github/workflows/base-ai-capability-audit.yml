name: Base AI Capability Audit

on:
  push:
    paths:
      - ".github/workflows/base-ai-capability-audit.yml"
      - "scripts/audit_base_ai_capability.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: base-ai-capability-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - name: Checkout unchanged base AI
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evaluation runtime
        run: |
          python -m pip install --disable-pip-version-check \
            lightgbm==4.6.0 pandas==2.3.3 numpy==2.2.6 \
            scikit-learn==1.7.2 python-dotenv==1.1.1

      - name: Download existing retrained model artifact
        uses: actions/download-artifact@v4
        with:
          name: base-ai-44-audit
          run-id: 39911266752
          github-token: ${{ github.token }}
          path: previous_training

      - name: Download original database and baseline model
        run: |
          set -euo pipefail
          mkdir -p db results capability_outputs
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            --max-time 300 --output db/keirin.db \
            https://github.com/haruqube/keirin-ai-predictor/releases/download/data-latest/keirin.db
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            --max-time 120 --output results/model_lgbm.pkl \
            https://github.com/haruqube/keirin-ai-predictor/releases/download/data-latest/model_lgbm.pkl

      - name: Audit what the fixed LambdaRank can and cannot discriminate
        run: python scripts/audit_base_ai_capability.py

      - name: Save capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-ai-capability-evidence
          path: capability_outputs/
          if-no-files-found: warn
          retention-days: 90
