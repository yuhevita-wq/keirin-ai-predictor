name: Archive Learned Exacta Score-Shape Models
on:
  push:
    paths:
      - ".github/workflows/archive-roi-learning.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model-training dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            scikit-learn==1.7.2 pandas==2.3.3 numpy==2.2.6 joblib==1.5.2
      - name: Retrieve verified frozen full-score training samples
        uses: actions/download-artifact@v4
        with:
          name: frozen-base-exacta-roi-evidence
          run-id: 39932361663
          github-token: ${{ github.token }}
          path: exacta_outputs
      - name: Retrain and SAVE separate score-use decision trees (no ranking edits)
        run: |
          python -m py_compile scripts/learn_roi_score_shape.py
          python -u scripts/learn_roi_score_shape.py
      - name: Persist audit, raw samples, and learned models
        uses: actions/upload-artifact@v4
        with:
          name: score-use-learning-trained-models
          path: exacta_outputs/
          retention-days: 90
          if-no-files-found: error
