name: Formation Cover Chronological Data Audit
on:
  push:
    branches: [research/formation-cover-20230101]
    paths: [.github/workflows/formation-cover-20230101.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collected-data-2023-01
          path: source
      - name: Inspect pre-race data only
        env:
          COLLECTION_KEY: ${{ secrets.COLLECTOR_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/formation-day.sqlite' EXIT
          test -n "$COLLECTION_KEY"
          printf %s "$COLLECTION_KEY" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 --output /tmp/formation-day.sqlite --decrypt source/encrypted/netkeirin-2023-01-01.sqlite.gpg
          python - <<'PY'
          import sqlite3,json,re
          c=sqlite3.connect("file:/tmp/formation-day.sqlite?mode=ro",uri=True)
          c.row_factory=sqlite3.Row
          tables=[r[0] for r in c.execute("select name from sqlite_master where type='table'")]
          print("TABLE_NAMES",json.dumps(tables))
          for t in ("races","entries"):
              print("SCHEMA",t,json.dumps([r[1] for r in c.execute("pragma table_info("+t+")")]))
          rows=[dict(r) for r in c.execute("select race_id,date,velodrome,race_number,start_time,rider_count from races where date='2023-01-01'")]
          def minutes(s):
              m=re.fullmatch(r"\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*",s or "")
              return int(m[1])*60+int(m[2]) if m and int(m[1])<24 and int(m[2])<60 else None
          valid=[r for r in rows if minutes(r["start_time"]) is not None]
          valid.sort(key=lambda r:(minutes(r["start_time"]),r["race_id"]))
          missing=[r for r in rows if minutes(r["start_time"]) is None]
          print("DAY_AUDIT",json.dumps({"races":len(rows),"timed":len(valid),"missing_time":len(missing)},ensure_ascii=False))
          print("SCHEDULE",json.dumps(valid,ensure_ascii=False))
          print("MISSING_TIME",json.dumps(missing,ensure_ascii=False))
          if valid and not missing:
              first=valid[0]
              cols=[r[1] for r in c.execute("pragma table_info(entries)")]
              allow=["race_id","rider_id","bike_number","rider_name","class","prefecture","gear_ratio","win_rate","place_rate","avg_competition_score","line_group","line_role"]
              chosen=[x for x in allow if x in cols]
              entries=[dict(r) for r in c.execute("select "+",".join(chosen)+" from entries where race_id=? order by bike_number",(first["race_id"],))]
              print("FIRST_RACE",json.dumps(first,ensure_ascii=False))
              print("FIRST_ENTRIES",json.dumps(entries,ensure_ascii=False))
              raw=c.execute("select payload from source_records where race_id=?",(first["race_id"],)).fetchone()
              if raw:
                  print("FIRST_RAW_ENTRY",json.dumps(json.loads(raw[0]).get("entry"),ensure_ascii=False))
          PY
