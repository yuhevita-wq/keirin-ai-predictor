name: HaruQ All Daily Races (Frozen March21, No Retraining)

on:
  push:
    branches: [operations/haruq-daily-20261024]
    paths:
      - "race_requests/days/*.json"

permissions:
  contents: write

concurrency:
  group: flagship-web-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-model-all-races:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout HaruQ operations branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify historical feature source and load immutable version
        shell: bash
        run: |
          set -euo pipefail
          test "${#COLLECTOR_PASSPHRASE}" -ge 32
          cp research_snapshots/haruqube_20260321/config.py config.py
          cp research_snapshots/haruqube_20260321/features/builder.py features/builder.py
          cp research_snapshots/haruqube_20260321/features/line_features.py features/line_features.py
          test "$(git hash-object config.py)" = 011c2091816d16358dfe478726bcb0ff2bc74bf9
          test "$(git hash-object features/builder.py)" = b47b793b5cf763bcb6d05137a115105006e50eba
          test "$(git hash-object features/line_features.py)" = ecf3ab7c762475946054f806bb1d4b802c889389
      - name: Install original-compatible inference environment
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check \
            lightgbm==4.6.0 pandas==2.3.3 numpy==2.2.6 \
            scikit-learn==1.7.2 python-dotenv==1.1.1 \
            requests beautifulsoup4 lxml
          python -m scripts.test_flagship_live
      - name: Download verified frozen model and encrypted rolling history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flagship_inputs db
          gh release download haruqube-20260321-flagship-v1 \
            --repo "$GITHUB_REPOSITORY" --pattern haruqube_20260321_fresh_model.pkl \
            --dir flagship_inputs
          TAG=haruqube-20260321-history-cache-live
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG=haruqube-20260321-history-cache-v1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern keirin-history.sqlite.gpg --dir flagship_inputs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern PLAINTEXT_SHA256.txt --dir flagship_inputs
          printf '%s' "$COLLECTOR_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --output db/keirin.db \
            --decrypt flagship_inputs/keirin-history.sqlite.gpg
          ( cd db && sha256sum -c ../flagship_inputs/PLAINTEXT_SHA256.txt )
      - name: Discover all published races and run existing frozen predictor
        shell: bash
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          REQ=$(git diff --name-only "$BEFORE_COMMIT" "$EVENT_COMMIT" | grep '^race_requests/days/[^/]*\.json$' | tail -n 1)
          test -n "$REQ" && test -s "$REQ"
          python -u -m scripts.haruq_daily --request "$REQ" --model flagship_inputs/haruqube_20260321_fresh_model.pkl
      - name: Store per-race machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haruq-daily-${{ github.run_id }}
          path: flagship_daily_results/
          if-no-files-found: warn
          retention-days: 30
      - name: Push verified results to public HaruQ JSON feed
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/haruq/results/*.json docs/haruq/results/runs/*.json docs/haruq/days/*.json
          git diff --cached --quiet && exit 1
          git commit -m "HaruQ full-day results ${GITHUB_RUN_ID} [skip ci]"
          # Restore CI-only copies of original 03/21 sources; do NOT rewrite frozen refs.
          git restore -- config.py features/builder.py features/line_features.py
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "HARUQ_BATCH_WEB_PUBLISHED"
              exit 0
            fi
            sleep 2
          done
          echo "HaruQ batch push conflict after 4 retry attempts" >&2
          exit 1
      - name: Remove plaintext history from runner
        if: always()
        run: rm -f db/keirin.db flagship_inputs/haruqube_20260321_fresh_model.pkl
