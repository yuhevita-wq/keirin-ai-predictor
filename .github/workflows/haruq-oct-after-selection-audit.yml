name: HaruQ 2026-10 External Out-of-Time ROI Test

on:
  push:
    branches: [audit/haruq-20261023-oct-forwardtest]
    paths: [.github/workflows/haruq-oct-after-selection-audit.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-october:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COLLECTOR_PASSPHRASE: ${{ secrets.COLLECTOR_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore original source and validate Git blobs (runtime only)
        shell: bash
        run: |
          set -euo pipefail
          test "${#COLLECTOR_PASSPHRASE}" -ge 32
          cp research_snapshots/haruqube_20260321/config.py config.py
          cp research_snapshots/haruqube_20260321/features/builder.py features/builder.py
          cp research_snapshots/haruqube_20260321/features/line_features.py features/line_features.py
          test "$(git hash-object config.py)" = 011c2091816d16358dfe478726bcb0ff2bc74bf9
          test "$(git hash-object features/builder.py)" = b47b793b5cf763bcb6d05137a115105006e50eba
          test "$(git hash-object features/line_features.py)" = ecf3ab7c762475946054f806bb1d4b802c889389
      - name: Install fixed scientific runtime
        run: |
          python -m pip install --disable-pip-version-check \
            lightgbm==4.6.0 pandas==2.3.3 numpy==2.2.6 \
            scikit-learn==1.7.2 python-dotenv==1.1.1 \
            requests beautifulsoup4 lxml
      - name: Restore immutable pretrained model and encrypted complete-day data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original db
          gh release download haruqube-20260321-flagship-v1 \
            --repo "$GITHUB_REPOSITORY" --pattern haruqube_20260321_fresh_model.pkl \
            --dir original
          TAG=haruqube-20260321-history-cache-live
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG=haruqube-20260321-history-cache-v1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern keirin-history.sqlite.gpg --dir original
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern PLAINTEXT_SHA256.txt --dir original
          printf '%s' "$COLLECTOR_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --output db/keirin.db \
            --decrypt original/keirin-history.sqlite.gpg
          ( cd db && sha256sum -c ../original/PLAINTEXT_SHA256.txt )
      - name: Recalculate independent October only test
        shell: bash
        run: |
          python -u -m scripts.audit_haruq_oct_2026 \
            --model original/haruqube_20260321_fresh_model.pkl \
            --output haruq_oct_2026_forward_test.json \
            | tee haruq_oct_2026_forward_test.log
      - name: Preserve audit even on publish failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haruq-oct-after-selection-test-${{ github.run_id }}
          path: |
            haruq_oct_2026_forward_test.json
            haruq_oct_2026_forward_test.log
          if-no-files-found: warn
      - name: Archive completed audit away from frozen model
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_audits/haruq
          cp haruq_oct_2026_forward_test.json research_audits/haruq/post_selection_oct2026.json
          git restore -- config.py features/builder.py features/line_features.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research_audits/haruq/post_selection_oct2026.json
          git commit -m "Archive post-selection Oct2026 HaruQ real outcome audit [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "HARUQ_OCT_AFTER_SELECTION_SAVED"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Delete decrypted race history
        if: always()
        run: rm -f db/keirin.db original/haruqube_20260321_fresh_model.pkl
