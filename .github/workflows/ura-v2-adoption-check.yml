name: Verify adopted Ura V2 selection (immutable V1)
on:
  push:
    branches:
      - ura-haruq/independent-train-20261024
    paths:
      - .github/workflows/ura-v2-adoption-check.yml
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original V1 and adopted module
        shell: bash
        run: |
          set -euo pipefail
          echo 'b0891724787f3c300a2b58d0d19cc6cf4ff421225ea53c81b94ab3add7194818  ura_haruq_independent/frozen_ura_haru_v1/URA_HARU_V1_FROZEN_RULE.py' | sha256sum -c -
          python -m unittest ura_haruq_independent.test_adopted_v2 -v
          python -m py_compile ura_haruq_independent/adopted_v2.py ura_haruq_independent/verify_adopted_v2_historical.py
      - name: Download unaltered original 3501-race V1 audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ura-v1-original"
          gh run download 40273267604 --repo "$GITHUB_REPOSITORY" --name ura-v1-profit-loss-selection-chronological-audit-20261026 --dir "$RUNNER_TEMP/ura-v1-original"
          test -s "$RUNNER_TEMP/ura-v1-original/every_verified_v1_race.csv"
      - name: Reproduce 2024-2026 realized settlements under exact adopted V2
        shell: bash
        run: |
          set -euo pipefail
          python -m ura_haruq_independent.verify_adopted_v2_historical --historical-csv "$RUNNER_TEMP/ura-v1-original/every_verified_v1_race.csv" > /tmp/ura-v2-audit.json
          cat /tmp/ura-v2-audit.json
      - name: Save successful adoption checks in independent Ura branch
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/ura_haruq_independent/ADOPTED_V2_VERIFICATION.json" \
            -f message="Verify officially adopted Ura V2 historical sums and unit tests" \
            -f content="$(base64 -w0 /tmp/ura-v2-audit.json)" \
            -f branch="$GITHUB_REF_NAME" > /dev/null
