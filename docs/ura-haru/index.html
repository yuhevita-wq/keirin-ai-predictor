<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>裏ハルキュー｜教科書フォーメーション</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101920;color:#ecf5f4}body{max-width:1100px;margin:auto;padding:30px 20px}h1{font-size:28px}small,p{color:#a8bfbe;line-height:1.8}button,input{font:inherit;border:1px solid #395657;border-radius:8px;background:#1d3038;color:inherit;padding:10px;margin:4px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#182830;padding:20px;border:1px solid #29454a;border-radius:12px}.buy{border-color:#6edeb9}.shape{font-size:21px;font-weight:700;color:#83e6c7}.muted{color:#a8bfbe}.error{color:#ffb3a6}a{color:#83e6c7}summary{cursor:pointer}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #29454a}</style>
<h1>裏ハルキュー <small>教科書フォーメーション</small></h1>
<p>低評価選手が入る決着の関係を形にし、フォーメーション全体の確率・価格・費用で採用と見送りを判断します。新方式の収益は未検証です。</p>
<label>日付 <input id="date" type="date"></label><button id="reload">更新</button>
<p id="status" role="status">独立予測フィードを読み込み中…</p><main id="races" class="grid"></main>
<script>
'use strict';
const SYSTEM='URA_MANUAL_FORMATIONS_V1_20261030';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('ja-JP')+'円';
let items=[];
$('date').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());
const reasons={MISSING_COMPATIBLE_INDEPENDENT_PROBABILITIES:'独立モデルに対応する確率が未取得',MISSING_ODDS:'購入前オッズ未取得',NOT_LOW_CONFIDENCE:'LOW対象外',MISSING_PRESTART_TIMESTAMPS:'発走前の観測時刻を確認できない',NO_WHOLE_FORMATION_PRICE_EDGE:'集合全体の価格条件に届かない',WHOLE_FORMATION_PRICE_EDGE:'集合全体の価格条件に該当'};
function render(){const rows=items.filter(r=>r.date===$('date').value);$('status').textContent=rows.length+'レース ／ 採用 '+rows.filter(r=>r.status==='BET').length+'レース';$('races').innerHTML=rows.map(r=>'<article class="card '+(r.status==='BET'?'buy':'')+'"><h2>'+esc(r.velodrome)+' '+Number(r.race_number)+'R</h2><p>'+esc(r.start_time||'発走時刻未取得')+' ／ '+esc(r.grade)+'</p><strong>'+(r.status==='BET'?'採用':'見送り')+'</strong><p>'+esc(reasons[r.reason]||r.reason)+'</p>'+(r.formation_notations||[]).map(x=>'<div class="shape">'+esc(x)+'</div>').join('')+'<p>'+Number(r.points||0)+'点 ／ '+money(r.total_yen)+'</p><button data-race="'+esc(r.race_id)+'">詳細</button><div id="detail-'+esc(r.race_id)+'"></div></article>').join('');}
async function load(){try{const res=await fetch('./results/index.json?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('フィードを取得できません');const data=await res.json();if(data.system!==SYSTEM)throw Error('教科書方式の初回公開待ちです。旧方式の買い目は表示しません。');items=data.items;render();}catch(e){$('status').textContent=e.message;$('races').replaceChildren();}}
$('races').onclick=async e=>{const rid=e.target.dataset.race;if(!rid)return;try{const res=await fetch('./results/'+rid+'.json?v='+Date.now());if(!res.ok)throw Error('詳細を取得できません');const d=await res.json();if(d.system!==SYSTEM||d.race_id!==rid)throw Error('予測の方式が一致しません');const f=d.ura_haru_manual_display,s=f.selected;let html='<p>'+esc(reasons[f.reason]||f.reason)+'</p>';if(s){html+=s.blocks.map(b=>'<p><b>'+esc(b.notation)+'</b><br>'+esc(b.reason)+'</p>').join('');const m=s.metrics;html+='<p>推定的中確率 '+(100*m.probability_mass).toFixed(2)+'％ ／ 推定回収率 '+(100*m.estimated_roi).toFixed(2)+'％</p><details><summary>含まれる組番を確認</summary><p>'+s.tickets.map(esc).join(' ／ ')+'</p></details>';}else{html+='<p>生成された形 '+Number(f.candidate_count||0)+'候補。必要な確率・価格がそろうまで購入対象を選びません。</p>';}html+='<p>予測作成 '+esc(d.published_at)+'<br>新方式の将来収益は未検証です。</p>';$('detail-'+rid).innerHTML=html;}catch(err){$('detail-'+rid).textContent=err.message;}};
$('reload').onclick=load;$('date').onchange=render;load();
</script></html>
